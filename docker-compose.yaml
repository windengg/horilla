services:
  server:
    image: windengg/horilla:latest
    container_name: horilla
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/horilla"
      CSRF_TRUSTED_ORIGINS: "https://hr.windengg.com"
      ALLOWED_HOSTS: "windengg.com,hr.windengg.com,localhost,127.0.0.1,100.127.10.95,10.0.0.97"
    command: sh ./entrypoint.sh
    volumes:
    #  - /volume1/docker/horilla/app:/app/horilla
      - /volume1/docker/horilla/media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - horilla-net

  db:
    image: postgres:16-bullseye
    container_name: horilla_db
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - /volume1/docker/horilla/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - horilla-net

networks:
  horilla-net:
    driver: bridge