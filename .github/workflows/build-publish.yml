name: Build and Publish Multi-Arch Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - "README.md"
      - ".github/**"
  pull_request_target:
    branches: [ main ]
    paths-ignore:
      - "README.md"
      - ".github/**"
  schedule:
    - cron: "00 07 * * TUE"

env:
  IMAGE_BASE_NAME: windengg/horilla
  GHCR_BASE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-6)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Build & Push platform-specific image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE_NAME }}:latest-${{ matrix.suffix }}
            ${{ env.IMAGE_BASE_NAME }}:${{ steps.vars.outputs.short_sha }}-${{ matrix.suffix }}
            ${{ env.GHCR_BASE_NAME }}:latest-${{ matrix.suffix }}
            ${{ env.GHCR_BASE_NAME }}:${{ steps.vars.outputs.short_sha }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  combine:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-6)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_BASE_NAME }}:latest \
            --tag ${{ env.IMAGE_BASE_NAME }}:${{ steps.vars.outputs.short_sha }} \
            ${{ env.IMAGE_BASE_NAME }}:latest-amd64 \
            ${{ env.IMAGE_BASE_NAME }}:latest-arm64
            
      - name: Create and push multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.GHCR_BASE_NAME }}:latest \
            --tag ${{ env.GHCR_BASE_NAME }}:${{ steps.vars.outputs.short_sha }} \
            ${{ env.GHCR_BASE_NAME }}:latest-amd64 \
            ${{ env.GHCR_BASE_NAME }}:latest-arm64
